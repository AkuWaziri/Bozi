name: Deploy Bozi GM Contract

on:
  workflow_dispatch:
    inputs:
      rpc_url:
        description: "Base Mainnet RPC URL"
        required: true
        default: "https://mainnet.base.org"
        type: string
      fee_token:
        description: "Base USDC contract address"
        required: true
        default: "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"
        type: string
      fee_amount:
        description: "USDC fee in base units (0.01 USDC = 10000)"
        required: true
        default: "10000"
        type: string
      network_name:
        description: "Target network"
        required: true
        default: "Base Mainnet"
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BOZI_FEE_RECIPIENT: ${{ secrets.BOZI_FEE_RECIPIENT }}
      PRIVATE_KEY: ${{ secrets.BOZI_DEPLOYER_PRIVATE_KEY }}
      RPC_URL: ${{ inputs.rpc_url }}
      BOZI_FEE_TOKEN: ${{ inputs.fee_token }}
      BOZI_FEE_AMOUNT: ${{ inputs.fee_amount }}
      NETWORK_NAME: ${{ inputs.network_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install forge-std
        run: forge install foundry-rs/forge-std --no-commit

      - name: Build contract
        run: forge build

      - name: Deploy
        run: |
          forge script script/DeployBoziGM.s.sol:DeployBoziGM \
            --rpc-url "$RPC_URL" \
            --private-key "$PRIVATE_KEY" \
            --broadcast \
            -vvvv

      - name: Deployment summary
        run: |
          echo "Bozi GM deployment workflow completed for $NETWORK_NAME."
          echo "Fee token: $BOZI_FEE_TOKEN"
          echo "Fee amount: $BOZI_FEE_AMOUNT"
